<text x="58" y="65.5" font-size="15" fill="#1971c2">B · ESTIMATOR CORE — one estimand: the latent price of machine services</text>
<text x="78" y="115.5" font-size="15" fill="#1971c2">TAPE INDEXER</text>
<text x="78" y="138.2" font-size="13" fill="#1e1e1e">raw event ingestion</text>
<text x="78" y="151.2" font-size="13" fill="#1e1e1e">volume-time bars (equal $)</text>
<text x="78" y="164.2" font-size="13" fill="#1e1e1e">clean ticks — Malachite finality</text>
<text x="453" y="115.5" font-size="15" fill="#1971c2">OBSERVATION MODEL · Pillar 1</text>
<text x="453" y="138.2" font-size="13" fill="#1e1e1e">observed = latent ∘ batch-H + noise</text>
<text x="453" y="151.2" font-size="13" fill="#1e1e1e">state-space; H = box avg, width k</text>
<text x="453" y="164.2" font-size="13" fill="#1e1e1e">Kalman filter + RTS smoother</text>
<text x="453" y="177.2" font-size="13" fill="#1e1e1e">deconvolves batching; var → CI</text>
<text x="453" y="190.2" font-size="13" fill="#1e1e1e">observation_model.py</text>
<text x="78" y="263.5" font-size="15" fill="#1971c2">CLEANING STACK</text>
<text x="78" y="286.2" font-size="13" fill="#1e1e1e">4 funding-graph defenses:</text>
<text x="78" y="299.2" font-size="13" fill="#1e1e1e">· self-deal  (buyer = seller)</text>
<text x="78" y="312.2" font-size="13" fill="#1e1e1e">· wash-cycle  (reciprocal A↔B)</text>
<text x="78" y="325.2" font-size="13" fill="#1e1e1e">· Louvain sybil   I/(I+B)</text>
<text x="78" y="338.2" font-size="13" fill="#1e1e1e">· 2-sided cluster caps</text>
<text x="78" y="351.2" font-size="13" fill="#1e1e1e">~100% injected wash zeroed</text>
<text x="513" y="323.5" font-size="15" fill="#1971c2">ROBUST ESTIMATOR</text>
<text x="513" y="346.2" font-size="13" fill="#1e1e1e">α-trim volume-weighted median</text>
<text x="513" y="359.2" font-size="13" fill="#1e1e1e">breakdown point ½</text>
<text x="513" y="372.2" font-size="13" fill="#1e1e1e">weighted-bootstrap CI / print</text>
<text x="513" y="385.2" font-size="13" fill="#1e1e1e">robust.py</text>
<text x="78" y="513.5" font-size="15" fill="#1971c2">HEDONIC ADJUSTMENT · Pillar 2</text>
<text x="78" y="536.2" font-size="13" fill="#1e1e1e">WLS:  log p ~ quality features</text>
<text x="78" y="549.2" font-size="13" fill="#1e1e1e">reprice → MID / 250ms reference</text>
<text x="78" y="562.2" font-size="13" fill="#1e1e1e">→ constant-quality rate</text>
<text x="78" y="575.2" font-size="13" fill="#1e1e1e">Case-Shiller for compute</text>
<text x="78" y="588.2" font-size="13" fill="#1e1e1e">hedonic.py</text>
<text x="513" y="525.5" font-size="15" fill="#1971c2">ROBUSTNESS DIAGNOSTICS</text>
<text x="513" y="548.2" font-size="13" fill="#1e1e1e">single-cluster flip  c/(0.5(1−2α))</text>
<text x="513" y="561.2" font-size="13" fill="#1e1e1e">leave-one-community-out shift (bp)</text>
<text x="513" y="574.2" font-size="13" fill="#1e1e1e">robustness.py</text>
<text x="513" y="651.5" font-size="15" fill="#f08c00">ACR PRINTS (hourly)</text>
<text x="513" y="674.2" font-size="13" fill="#1e1e1e">ACR-INF  $/1k tokens</text>
<text x="513" y="687.2" font-size="13" fill="#1e1e1e">ACR-GPU  $/GPU-sec</text>
<text x="513" y="700.2" font-size="13" fill="#1e1e1e">ACR-DATA  $/MB</text>
<text x="513" y="713.2" font-size="13" fill="#1e1e1e">+ CI  + attack-cost / bp</text>
<text x="78" y="725.5" font-size="15" fill="#e03131">MANIPULATION COST BOUND · Pillar 3</text>
<text x="78" y="748.2" font-size="13" fill="#1e1e1e">least surviving wash N* to move 1bp</text>
<text x="78" y="761.2" font-size="13" fill="#1e1e1e">threat: cleaning-evading sybil</text>
<text x="78" y="774.2" font-size="13" fill="#1e1e1e">cost = 2N*·fee_bp + (N*/trade + ids)·fee_flat</text>
<text x="78" y="787.2" font-size="13" fill="#1e1e1e">a NUMBER on Arc (deterministic fee)</text>
<text x="78" y="800.2" font-size="13" fill="#1e1e1e">bound.py + redteam/optimal_attack.py</text>
<text x="1578" y="65.5" font-size="15" fill="#e8590c">C · ON-CHAIN (settlement-grade)</text>
<text x="1593" y="115.5" font-size="15" fill="#e8590c">SIGNER</text>
<text x="1593" y="138.2" font-size="13" fill="#1e1e1e">LocalKeySigner (raw key · dev)</text>
<text x="1593" y="151.2" font-size="13" fill="#1e1e1e">CircleWalletSigner — Dev-Controlled Wallet</text>
<text x="1593" y="164.2" font-size="13" fill="#1e1e1e">circle-developer-controlled-wallets SDK</text>
<text x="1593" y="243.5" font-size="15" fill="#e8590c">ACROracle.sol</text>
<text x="1593" y="266.2" font-size="13" fill="#1e1e1e">EIP-712 verifies the signer</text>
<text x="1593" y="279.2" font-size="13" fill="#1e1e1e">any relayer submits postPrint</text>
<text x="1593" y="292.2" font-size="13" fill="#1e1e1e">invariants: value∈CI · bound&gt;0</text>
<text x="1593" y="305.2" font-size="13" fill="#1e1e1e">monotone ts · MAX_TS_SKEW</text>
<text x="1593" y="318.2" font-size="13" fill="#1e1e1e">isStale · pause · 2-step owner</text>
<text x="1593" y="460.5" font-size="15" fill="#e8590c">AttestationRegistry.sol</text>
<text x="1593" y="483.2" font-size="13" fill="#1e1e1e">EIP-712 seller metadata · nonce + deadline</text>
<text x="1593" y="496.2" font-size="13" fill="#1e1e1e">attestWithSig — seller signs, relayer pays</text>
<text x="1593" y="509.2" font-size="13" fill="#1e1e1e">→ one relayer registers many sellers</text>
<text x="1593" y="588.5" font-size="15" fill="#e8590c">FOUNDRY</text>
<text x="1593" y="610.3" font-size="12" fill="#1e1e1e">50 tests · invariants: oracle · registry · futures</text>
<text x="1593" y="622.3" font-size="12" fill="#1e1e1e">netOI=0 · collateral-backed · fail_on_revert</text>
<text x="1593" y="692.5" font-size="15" fill="#e8590c">CIRCLE DEPLOY</text>
<text x="1593" y="715.2" font-size="13" fill="#1e1e1e">Smart Contract Platform + Gas Station</text>
<text x="1593" y="728.2" font-size="13" fill="#1e1e1e">oracle + registry + ACRFutures → setSigner</text>
<text x="1593" y="741.2" font-size="13" fill="#1e1e1e">deploy_circle.py · Deploy / DeployFutures.s.sol</text>
<text x="1578" y="875.5" font-size="15" fill="#2f9e44">D · INSTRUMENT &amp; PUBLIC DESK (Pillar 4 · on-chain)</text>
<text x="1593" y="919.5" font-size="15" fill="#2f9e44">ACRFutures.sol  (on-chain venue)</text>
<text x="1593" y="941.3" font-size="12" fill="#1e1e1e">weekly cash-settled vs oracle · stale-guard (7200s)</text>
<text x="1593" y="953.3" font-size="12" fill="#1e1e1e">maker mirrors every taker → net OI = 0 · 20% margin</text>
<text x="1593" y="965.3" font-size="12" fill="#1e1e1e">USDC collateral · Traded tape · socialized-loss settle</text>
