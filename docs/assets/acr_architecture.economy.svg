<text x="108" y="683.5" font-size="15" fill="#9c36b5">AUTONOMOUS HEDGER — reads the rate, then trades on it</text>
<text x="108" y="705.3" font-size="12" fill="#1e1e1e">Circle agent wallet (no exportable key) · scripts/hedger.py · GET /hedger</text>
<text x="108" y="717.3" font-size="12" fill="#1e1e1e">1 pay x402 for ACR-INF print → 2 read own on-chain futures position</text>
<text x="108" y="729.3" font-size="12" fill="#1e1e1e">3 gap = mandate TARGET − position → 4 trade(qty) the difference</text>
