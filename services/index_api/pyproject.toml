[project]
name = "acr-index-api"
version = "0.1.0"
description = "x402-gated ACR index API + scheduled oracle-poster job (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "acr-core",
    "acr-sim",
    "acr-tape",
    "acr-estimator",
    "acr-instrument",
    "acr-oracle-client",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "cryptography>=42",  # verify Circle webhook ECDSA P-256 signatures
]

[tool.uv.sources]
acr-core = { workspace = true }
acr-sim = { workspace = true }
acr-tape = { workspace = true }
acr-estimator = { workspace = true }
acr-instrument = { workspace = true }
acr-oracle-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["index_api"]
