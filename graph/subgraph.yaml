specVersion: 1.1.0
description: "The public tape behind Machine TCA: ACR prints, seller
  attestations, futures fills, and mirrored x402 settlements benchmarked against
  the print each payer could have seen when they paid."
repository: https://github.com/kaustubh76/ACR---Arc-Compute-Rate
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ACROracle
    network: arc
    source:
      abi: ACROracle
      address: "0xAfe8a941957EbD3C759fEA5365fe4B75f9626D07"
      startBlock: 23013298
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/oracle.ts
      entities:
        - Print
        - EconomicPrint
        - PrintRing
        - SignerChange
        - PauseChange
      abis:
        - name: ACROracle
          file: ./abis/ACROracle.json
      eventHandlers:
        - event: PricePosted(indexed
            bytes32,uint256,uint256,uint256,uint256,uint64,indexed address)
          handler: handlePricePosted
        - event: SignerSet(indexed address,bool)
          handler: handleSignerSetV1
        - event: PausedSet(bool)
          handler: handlePausedSetV1
  - kind: ethereum/contract
    name: ACROracleV2
    network: arc
    source:
      abi: ACROracleV2
      address: "0xF77E763ef710096c0b9F02Ea16F76e68E0312f81"
      startBlock: 23013298
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/oracle.ts
      entities:
        - Print
        - EconomicPrint
        - PrintRing
        - SignerChange
        - PauseChange
      abis:
        - name: ACROracleV2
          file: ./abis/ACROracleV2.json
      eventHandlers:
        - event: PricePosted(indexed bytes32,indexed bytes32,indexed
            address,uint256,uint256,uint256,uint256,uint256,uint64,uint64,uint64)
          handler: handlePricePostedV2
        - event: SignerSet(indexed address,bool)
          handler: handleSignerSetV2
        - event: PausedSet(bool)
          handler: handlePausedSetV2
  - kind: ethereum/contract
    name: AttestationRegistry
    network: arc
    source:
      abi: AttestationRegistry
      address: "0x13CF727d1D25283d58Efe7647dCf30e9cE255096"
      startBlock: 23013298
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities:
        - Attestation
        - Seller
      abis:
        - name: AttestationRegistry
          file: ./abis/AttestationRegistry.json
      eventHandlers:
        - event: Attested(indexed address,indexed uint8,uint8,uint32,bytes32,uint64)
          handler: handleAttested
  - kind: ethereum/contract
    name: ACRFutures
    network: arc
    source:
      abi: ACRFutures
      address: "0xdb5D7dbB67aD8EC8517982E95c89906abFBC6d3b"
      startBlock: 23013298
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/futures.ts
      entities:
        - FuturesFill
        - Series
        - CollateralFlow
        - PrintRing
      abis:
        - name: ACRFutures
          file: ./abis/ACRFutures.json
      eventHandlers:
        - event: SeriesOpened(indexed uint256,indexed bytes32,uint64,uint256,address)
          handler: handleSeriesOpened
        - event: Traded(indexed uint256,indexed address,int256,uint256)
          handler: handleTraded
        - event: Settled(indexed uint256,uint256,uint256)
          handler: handleSettled
        - event: CollateralPosted(indexed uint256,indexed address,uint256)
          handler: handleCollateralPosted
        - event: CollateralWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleCollateralWithdrawn
  - kind: ethereum/contract
    name: FeedAccessAttestor
    network: arc
    source:
      abi: FeedAccessAttestor
      address: "0xB9508caD4A5C367C3a62B6767C4837a607EaA490"
      startBlock: 23013300
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/access.ts
      entities:
        - FeedAccess
        - SignerChange
      abis:
        - name: FeedAccessAttestor
          file: ./abis/FeedAccessAttestor.json
      eventHandlers:
        - event: AccessGranted(indexed address,indexed address,uint64,uint256,uint256)
          handler: handleAccessGranted
        - event: SignerSet(indexed address,bool)
          handler: handleAttestorSignerSet
  - kind: ethereum/contract
    name: ReceiptMirror
    network: arc
    source:
      abi: ReceiptMirror
      address: "0x1a5390E59d4ce0a386Aa071365A932Dc34d35bE3"
      startBlock: 23013300
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mirror.ts
      entities:
        - PendingSettlement
        - Settlement
        - SellerDay
        - PayerDay
        - Payer
        - Seller
        - SellerPayerLink
        - SellerWindow
        - SellerWindowPayer
        - SellerWindowHuman
        - HumanCluster
        - SignerChange
        - Print
        - PrintRing
      abis:
        - name: ReceiptMirror
          file: ./abis/ReceiptMirror.json
      eventHandlers:
        - event: SettlementOpened(indexed bytes32,indexed address,indexed
            address,bytes32,uint256,uint64,uint64,bytes32,bool,bool)
          handler: handleSettlementOpened
        - event: SettlementFinalized(indexed bytes32,indexed address,indexed
            address,uint8,uint256,uint64)
          handler: handleSettlementFinalized
        - event: SignerSet(indexed address,bool)
          handler: handleMirrorSignerSet
  - kind: ethereum/contract
    name: HumanIdMirror
    network: arc
    source:
      abi: HumanIdMirror
      address: "0x7134622a01Add334eA306dDa5A5877b418a940B5"
      startBlock: 23013298
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/humanid.ts
      entities:
        - HumanCluster
        - Payer
        - SignerChange
      abis:
        - name: HumanIdMirror
          file: ./abis/HumanIdMirror.json
      eventHandlers:
        - event: HumanClusterResolved(indexed bytes32,indexed address,indexed
            uint64,bool,address)
          handler: handleHumanClusterResolved
        - event: HumanClusterRebound(indexed address,indexed
            uint64,bytes32,bytes32,address)
          handler: handleHumanClusterRebound
        - event: SignerSet(indexed address,bool)
          handler: handleHumanIdSignerSet
