<text x="40" y="67.0" font-size="30" fill="#1e1e1e">ACR · THE ACCELERATOR PLAN</text>
<text x="40" y="99.5" font-size="15" fill="#495057">History and dependents. A reference rate's moat is how long it has printed and how much settles against it.</text>
<text x="40" y="125.5" font-size="15" fill="#495057">Arc mainnet launches September 16, mid-programme: a once-ever shot at genesis history. Every box below serves one of the two words.</text>
<text x="60" y="185.5" font-size="15" fill="#f08c00">THE EIGHT WEEKS · every week ends with a receipt, not a status</text>
<text x="76" y="233.2" font-size="12.5" fill="#1971c2">W1 · REHEARSE THE SWITCH</text>
<text x="76" y="262.4" font-size="11.5" fill="#1e1e1e">mainnet dry run on a fork</text>
<text x="76" y="273.9" font-size="11.5" fill="#1e1e1e">SCP deploy pipeline stood up</text>
<text x="76" y="285.4" font-size="11.5" fill="#1e1e1e">SLO monitors: latency, gap,</text>
<text x="76" y="296.9" font-size="11.5" fill="#1e1e1e">staleness (alerts, not dashboards)</text>
<text x="348" y="233.2" font-size="12.5" fill="#1971c2">W2 · THE ONE-DAY PATH</text>
<text x="348" y="262.4" font-size="11.5" fill="#1e1e1e">attest-and-get-listed flow ships</text>
<text x="348" y="273.9" font-size="11.5" fill="#1e1e1e">ten-line settle-vs-ACR client SDK</text>
<text x="348" y="285.4" font-size="11.5" fill="#1e1e1e">attestation sprint #1 (cohort)</text>
<text x="348" y="296.9" font-size="11.5" fill="#1e1e1e">recruiting starts BEFORE genesis</text>
<text x="620" y="233.2" font-size="12.5" fill="#e8590c">W3 · GENESIS PRINT</text>
<text x="620" y="262.4" font-size="11.5" fill="#1e1e1e">day-one deploy at mainnet launch</text>
<text x="620" y="273.9" font-size="11.5" fill="#1e1e1e">failover press live (2 workers)</text>
<text x="620" y="285.4" font-size="11.5" fill="#1e1e1e">the history moat starts here</text>
<text x="620" y="296.9" font-size="11.5" fill="#1e1e1e">and can never be reopened</text>
<text x="892" y="233.2" font-size="12.5" fill="#e03131">W4 · CHECKPOINT: RECEIPTS</text>
<text x="892" y="262.4" font-size="11.5" fill="#1e1e1e">first external x402 payers</text>
<text x="892" y="273.9" font-size="11.5" fill="#1e1e1e">sellers attested so far, on-chain</text>
<text x="892" y="285.4" font-size="11.5" fill="#1e1e1e">behind shows here, in public</text>
<text x="892" y="296.9" font-size="11.5" fill="#1e1e1e">sprint #2 with mainnet history</text>
<text x="1164" y="233.2" font-size="12.5" fill="#1971c2">W5 · OPEN THE BOOKS</text>
<text x="1164" y="262.4" font-size="11.5" fill="#1e1e1e">futures books accept external</text>
<text x="1164" y="273.9" font-size="11.5" fill="#1e1e1e">counterparties (caps + margin</text>
<text x="1164" y="285.4" font-size="11.5" fill="#1e1e1e">already enforced on-chain)</text>
<text x="1164" y="296.9" font-size="11.5" fill="#1e1e1e">maker depth policy published</text>
<text x="1436" y="233.2" font-size="12.5" fill="#1971c2">W6 · THE FIRST DEPENDENT</text>
<text x="1436" y="262.4" font-size="11.5" fill="#1e1e1e">one cohort protocol settles</text>
<text x="1436" y="273.9" font-size="11.5" fill="#1e1e1e">against ACR; I write their</text>
<text x="1436" y="285.4" font-size="11.5" fill="#1e1e1e">integration PR myself</text>
<text x="1436" y="296.9" font-size="11.5" fill="#1e1e1e">dependents make it infrastructure</text>
<text x="1708" y="233.2" font-size="12.5" fill="#1971c2">W7 · ADMINISTRATION</text>
<text x="1708" y="262.4" font-size="11.5" fill="#1e1e1e">methodology v1.0 under</text>
<text x="1708" y="273.9" font-size="11.5" fill="#1e1e1e">change-control · versioned</text>
<text x="1708" y="285.4" font-size="11.5" fill="#1e1e1e">public incident policy</text>
<text x="1708" y="296.9" font-size="11.5" fill="#1e1e1e">governance before it is needed</text>
<text x="1980" y="233.2" font-size="12.5" fill="#1971c2">W8 · DEMO DAY</text>
<text x="1980" y="262.4" font-size="11.5" fill="#1e1e1e">hourly prints since genesis</text>
<text x="1980" y="273.9" font-size="11.5" fill="#1e1e1e">8 to 10 sellers · 3+ payers</text>
<text x="1980" y="285.4" font-size="11.5" fill="#1e1e1e">1 protocol settling against it</text>
<text x="1980" y="296.9" font-size="11.5" fill="#1e1e1e">every number clickable</text>
<text x="540" y="477.7" font-size="13" fill="#f08c00">SEP 16 · ARC MAINNET GENESIS</text>
<text x="60" y="565.5" font-size="15" fill="#1971c2">THE SWITCH · same audited contracts, harder infrastructure (weeks 1 to 3)</text>
<text x="84" y="617.8" font-size="12" fill="#495057">single in-process press</text>
<text x="84" y="629.8" font-size="12" fill="#495057">(testnet, today)</text>
<text x="572" y="617.8" font-size="12" fill="#1e1e1e">multi-worker press +</text>
<text x="572" y="629.8" font-size="12" fill="#1e1e1e">failover publisher</text>
<text x="572" y="641.8" font-size="12" fill="#1e1e1e">a rate that misses prints</text>
<text x="572" y="653.8" font-size="12" fill="#1e1e1e">is not a rate</text>
<text x="84" y="749.8" font-size="12" fill="#495057">measured cadence</text>
<text x="84" y="761.8" font-size="12" fill="#495057">(print-gaps · /ops ledger)</text>
<text x="572" y="749.8" font-size="12" fill="#1e1e1e">alerted SLOs</text>
<text x="572" y="761.8" font-size="12" fill="#1e1e1e">print latency · gap vs the</text>
<text x="572" y="773.8" font-size="12" fill="#1e1e1e">settle window · staleness</text>
<text x="572" y="785.8" font-size="12" fill="#1e1e1e">paging, not observing</text>
<text x="84" y="881.8" font-size="12" fill="#495057">Foundry deploys</text>
<text x="84" y="893.8" font-size="12" fill="#495057">(deploy_circle.py: tested,</text>
<text x="84" y="905.8" font-size="12" fill="#495057">never fired)</text>
<text x="572" y="881.8" font-size="12" fill="#1e1e1e">Smart Contract Platform</text>
<text x="572" y="893.8" font-size="12" fill="#1e1e1e">deploys + contract webhooks</text>
<text x="572" y="905.8" font-size="12" fill="#1e1e1e">the product my submission</text>
<text x="572" y="917.8" font-size="12" fill="#1e1e1e">said plainly it did not use</text>
<text x="1170" y="565.5" font-size="15" fill="#2f9e44">THE FLYWHEEL · adoption is the security model, not vanity</text>
<text x="1194" y="635.2" font-size="12.5" fill="#1e1e1e">INDEPENDENT SELLERS ATTEST</text>
<text x="1194" y="647.8" font-size="12.5" fill="#1e1e1e">target: 8 to 10 providers</text>
<text x="1194" y="660.2" font-size="12.5" fill="#1e1e1e">signed, on-chain, EIP-712</text>
<text x="1764" y="635.2" font-size="12.5" fill="#1e1e1e">FLOW DIVERSITY RISES</text>
<text x="1764" y="647.8" font-size="12.5" fill="#1e1e1e">more venues, more payers,</text>
<text x="1764" y="660.2" font-size="12.5" fill="#1e1e1e">harder exhaust to fake</text>
<text x="1764" y="865.2" font-size="12.5" fill="#1e1e1e">ATTACK-COST-PER-BP RISES</text>
<text x="1764" y="877.8" font-size="12.5" fill="#1e1e1e">published on every print</text>
<text x="1764" y="890.2" font-size="12.5" fill="#1e1e1e">the defense is a number</text>
<text x="1194" y="865.2" font-size="12.5" fill="#1e1e1e">CREDIBILITY COMPOUNDS</text>
<text x="1194" y="877.8" font-size="12.5" fill="#1e1e1e">3+ external payers</text>
<text x="1194" y="890.2" font-size="12.5" fill="#1e1e1e">1 protocol settling on it</text>
<text x="1528" y="780.8" font-size="12" fill="#2f9e44">the first real turn</text>
<text x="1528" y="792.8" font-size="12" fill="#2f9e44">happens in the cohort</text>
<text x="60" y="1075.5" font-size="15" fill="#9c36b5">CIRCLE PRODUCTS · what each one is FOR in this plan</text>
<text x="78" y="1121.2" font-size="12.5" fill="#9c36b5">ARC MAINNET</text>
<text x="78" y="1146.3" font-size="11.5" fill="#1e1e1e">the venue for genesis</text>
<text x="78" y="1157.8" font-size="11.5" fill="#1e1e1e">history · USDC gas keeps</text>
<text x="78" y="1169.3" font-size="11.5" fill="#1e1e1e">attack cost arithmetic</text>
<text x="626" y="1121.2" font-size="12.5" fill="#9c36b5">x402 + GATEWAY (live)</text>
<text x="626" y="1146.3" font-size="11.5" fill="#1e1e1e">the paid-query and</text>
<text x="626" y="1157.8" font-size="11.5" fill="#1e1e1e">settlement rails · already</text>
<text x="626" y="1169.3" font-size="11.5" fill="#1e1e1e">proven on testnet</text>
<text x="1174" y="1121.2" font-size="12.5" fill="#9c36b5">CIRCLE WALLETS</text>
<text x="1174" y="1146.3" font-size="11.5" fill="#1e1e1e">the operator fleet:</text>
<text x="1174" y="1157.8" font-size="11.5" fill="#1e1e1e">press · maker · taker ·</text>
<text x="1174" y="1169.3" font-size="11.5" fill="#1e1e1e">treasury · agent hedger</text>
<text x="1722" y="1121.2" font-size="12.5" fill="#9c36b5">GAS STATION</text>
<text x="1722" y="1146.3" font-size="11.5" fill="#1e1e1e">the Public Desk stays</text>
<text x="1722" y="1157.8" font-size="11.5" fill="#1e1e1e">free to try: sponsored</text>
<text x="1722" y="1169.3" font-size="11.5" fill="#1e1e1e">user-controlled SCAs</text>
<text x="78" y="1243.2" font-size="12.5" fill="#9c36b5">CCTP V2 (new)</text>
<text x="78" y="1268.3" font-size="11.5" fill="#1e1e1e">external payers hold USDC</text>
<text x="78" y="1279.8" font-size="11.5" fill="#1e1e1e">elsewhere · pay from any</text>
<text x="78" y="1291.3" font-size="11.5" fill="#1e1e1e">chain, settle on Arc</text>
<text x="626" y="1243.2" font-size="12.5" fill="#9c36b5">MARKETPLACE / DISCOVERY</text>
<text x="626" y="1268.3" font-size="11.5" fill="#1e1e1e">distribution: first</text>
<text x="626" y="1279.8" font-size="11.5" fill="#1e1e1e">Arc-native listing when</text>
<text x="626" y="1291.3" font-size="11.5" fill="#1e1e1e">the network lands there</text>
<text x="1174" y="1243.2" font-size="12.5" fill="#9c36b5">COMPLIANCE ENGINE (stretch)</text>
<text x="1174" y="1268.3" font-size="11.5" fill="#1e1e1e">KYB-gated attestation</text>
<text x="1174" y="1279.8" font-size="11.5" fill="#1e1e1e">tier: the bridge to a rate</text>
<text x="1174" y="1291.3" font-size="11.5" fill="#1e1e1e">TradFi desks can cite</text>
<text x="60" y="1415.5" font-size="15" fill="#e03131">THE HONEST BOTTLENECK · pre-declared</text>
<text x="70" y="1447.2" font-size="12.5" fill="#1e1e1e">Seller recruitment. Attestation asks providers to do work before the rate is famous.</text>
<text x="70" y="1459.8" font-size="12.5" fill="#1e1e1e">Mitigations, each one a playbook already run:</text>
<text x="70" y="1472.2" font-size="12.5" fill="#1e1e1e">· the one-day integration path (Flare DevRel: 8 months of oracle integration support)</text>
<text x="70" y="1484.8" font-size="12.5" fill="#1e1e1e">· cohort-first targeting with direct access (LNMHacks: USD 7,000 in protocol partnerships)</text>
<text x="70" y="1497.2" font-size="12.5" fill="#1e1e1e">· sequence mainnet history BEFORE the hardest asks: recruit with a track record, not a promise</text>
<text x="70" y="1509.8" font-size="12.5" fill="#1e1e1e">Behind at week 4 shows in the receipts. That is the point of building this way.</text>
<text x="1170" y="1415.5" font-size="15" fill="#f08c00">DEMO DAY, DEFINED · nothing claimed a judge cannot click</text>
<text x="1180" y="1447.2" font-size="12.5" fill="#1e1e1e">· a rate printing hourly on Arc mainnet since launch week (the history no one can re-run)</text>
<text x="1180" y="1459.8" font-size="12.5" fill="#1e1e1e">· 8 to 10 independent attesting sellers, signatures on-chain</text>
<text x="1180" y="1472.2" font-size="12.5" fill="#1e1e1e">· 3+ external payers on the x402 gate, receipts on the public tape</text>
<text x="1180" y="1484.8" font-size="12.5" fill="#1e1e1e">· one protocol cash-settling against ACR that is not ours</text>
<text x="1180" y="1497.2" font-size="12.5" fill="#1e1e1e">· methodology v1.0 published under change-control</text>
<text x="1180" y="1509.8" font-size="12.5" fill="#1e1e1e">· every number re-measured by verify_claims: the build fails when a claim and reality disagree</text>
</svg>