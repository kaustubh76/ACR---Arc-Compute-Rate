[app]
# Slug, kebab-case. MUST equal the `name` in `dyn_aomi_app!` (src/lib.rs); it
# becomes the release tag.
name         = "acr-compute-rate"
display_name = "ACR · Arc Compute Rate"
# Business billing records and treasury credentials require restricted app access.
public       = false

# PROD, AND MEASURED, NOT ASSUMED. The backend loads an App only when these tags
# are a subset of its own (aomi-sdk sdk/bin/build/deploy/app.rs), and an App that
# declares none defaults to ["staging"]. api.aomi.dev answers
# GET /api/platforms/server-tags with {"server_tags":["prod"],"sdk_version":"5.1.1"}
# (2026-10-13), so the default would build, activate, and never load on the
# backend chat.aomi.dev talks to.
server_tags  = ["prod"]
