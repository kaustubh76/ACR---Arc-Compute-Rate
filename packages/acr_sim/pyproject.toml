[project]
name = "acr-sim"
version = "0.1.0"
description = "Calibrated payment-exhaust simulator for ACR (latent process + batching + adversarial flow)"
requires-python = ">=3.11"
dependencies = ["acr-core", "numpy>=1.26"]

[tool.uv.sources]
acr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acr_sim"]
