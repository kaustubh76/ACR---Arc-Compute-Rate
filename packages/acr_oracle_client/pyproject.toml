[project]
name = "acr-oracle-client"
version = "0.1.0"
description = "EIP-712 sign ACR prints and post them to ACROracle.sol"
requires-python = ">=3.11"
dependencies = ["acr-core", "web3>=6.15", "eth-account>=0.11"]

# Optional live-wiring extra: the Circle Developer-Controlled Wallets SDK is only
# needed to sign/submit via a Circle-custodied wallet. Lazy-imported, so hermetic
# tests (which inject a fake client) never require it. Install with:
#   uv sync --extra circle
[project.optional-dependencies]
circle = ["circle-developer-controlled-wallets>=5.0"]

[tool.uv.sources]
acr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acr_oracle_client"]
