[project]
name = "acr-tape"
version = "0.1.0"
description = "TapeSource ingestion interface: SimSource + ArcSource (Arc testnet RPC)"
requires-python = ">=3.11"
dependencies = ["acr-core", "acr-sim", "acr-oracle-client", "web3>=6.15"]

[tool.uv.sources]
acr-core = { workspace = true }
acr-sim = { workspace = true }
acr-oracle-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acr_tape"]
