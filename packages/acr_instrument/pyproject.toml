[project]
name = "acr-instrument"
version = "0.1.0"
description = "Pillar 4: cash-settled ACR-Weekly future + Avellaneda-Stoikov market maker (paper-traded)"
requires-python = ">=3.11"
dependencies = ["acr-core", "numpy>=1.26"]

[tool.uv.sources]
acr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acr_instrument"]
