[project]
name = "acr-estimator"
version = "0.1.0"
description = "The ACR estimator — four pillars: observation model, cleaning, robust median, hedonic, manipulation bound"
requires-python = ">=3.11"
dependencies = [
    "acr-core",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "networkx>=3.2",
]

[tool.uv.sources]
acr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acr_estimator"]
