# Categories for auto-generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: ["ignore-for-release"]
  categories:
    - title: Features
      labels: ["feat", "enhancement"]
    - title: Fixes
      labels: ["fix", "bug"]
    - title: Security
      labels: ["security"]
    - title: Contracts
      labels: ["contracts"]
    - title: Documentation
      labels: ["docs", "documentation"]
    - title: Maintenance
      labels: ["chore", "ci"]
    - title: Other changes
      labels: ["*"]
