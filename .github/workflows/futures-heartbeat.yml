name: futures-heartbeat

# Keeps the on-chain futures book alive: mean-reverting trades against
# the deployed ACRFutures venue, so the /curve desk (inventory / OI / mark-to-oracle
# PnL) stays live 24/7 without a local process. Reuses the crash-proof, RPC-429-
# hardened, margin-bounded scripts/futures_loop.py.
#
# COST — GitHub bills each run rounded UP to the minute. A scheduled run is
# ~2.5 min (six fills at 15s), and in practice GitHub fires this 4-8 times a
# day rather than 24, so the real spend is far below the nominal ceiling.
# To change the cadence, edit the one cron line:
#   "0 * * * *"    hourly        (~≤1,440 min/mo)   ← current
#   "0 */2 * * *"  every 2 hours (~half)
#   "*/30 * * * *" every 30 min  (~double — watch the free 2,000-min tier)
# NOTE: GitHub drops most scheduled ticks on this repo (measured: 4-8 runs a day,
# not 24), so each run lands SIX fills rather than one — that is what keeps the
# public tape's 24 rows populated across its ~7.9h window instead of showing
# three or four. Dispatch it by hand with a larger `trades` input to refill the
# tape immediately.

#
# ── RETIRED FROM THE SCHEDULE 2026-08-03 ─────────────────────────────────────
# This job now runs on the TRUSTED HOST, not here. The venue signs through
# Circle custody, so a scheduled run in Actions would need
# ACR_CIRCLE_ENTITY_SECRET — a credential that controls every
# developer-controlled wallet, INCLUDING the one that signs oracle prints. That
# is a strictly larger blast radius than the scoped raw key it would replace,
# so the job moved to the service that already holds those credentials
# (services/index_api/index_api/keeper.py). Proven live: the Circle taker
# wallet traded 0.25 from the host at block 55127553.
#
# Kept as DISPATCH-ONLY on purpose rather than deleted: it is the manual
# fallback if the keeper is ever stood down (ACR_KEEPER=0) or the host is down,
# and it still signs with a scoped key that can drain exactly one liveness bot.
# The secret stays until the keeper has run unattended for longer than a
# demo — removing the fallback before the replacement has proven itself is the
# same mistake as trusting a fix nobody measured.

on:
  workflow_dispatch:
    inputs:
      trades:
        description: "Fills to land this run (a burst to fill the public tape)"
        type: string
        default: "12"
      interval:
        description: "Seconds between fills"
        type: string
        default: "12"

permissions:
  contents: read

# Never let two heartbeats trade at once (avoids nonce races on the taker).
concurrency:
  group: futures-heartbeat
  cancel-in-progress: false

jobs:
  trade:
    # Base repo only — forks never carry the secret and must not run this.
    if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
    runs-on: ubuntu-latest
    # Generous enough for a hand-dispatched burst; a scheduled run finishes in
    # about two and a half minutes.
    timeout-minutes: 14
    env:
      ACR_ARC_RPC_URL: https://rpc.testnet.arc.network
      ACR_ORACLE_ADDRESS: "0x4f00e3BDd224F4c4b4958D54cD774E84B9092609"
      ACR_FUTURES_ADDRESS: "0x29d97c629a8278f7ec4218ab0bd8baa9182642fe"
      LOOP_BAND: "4"
      # SIX fills a run, not one. The public tape renders 24 rows over a ~7.9h
      # window, and GitHub fires this 4-8 times a day — so one fill per run left
      # a market surface showing three or four trades. `inputs.*` is empty on a
      # scheduled run, so the fallbacks are the steady-state cadence.
      LOOP_MAX_TRADES: ${{ inputs.trades || '6' }}
      LOOP_INTERVAL: ${{ inputs.interval || '15' }}
      # Hard stop well inside the job timeout: the loop must never be the thing
      # that hangs the runner.
      LOOP_DURATION: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Mean-reverting fills
        env:
          TAKER_PRIVATE_KEY: ${{ secrets.ACR_FUTURES_TAKER_KEY }}
          # Trade the index that actually has a series. This used to rotate over
          # all three by hour, which meant two hours in three picked an index
          # with no series at all and the workflow failed — noise that would
          # have masked a real outage. Add indices here as they are seeded.
          SEED_INDEX: ACR-INF
        run: uv run python scripts/futures_loop.py
