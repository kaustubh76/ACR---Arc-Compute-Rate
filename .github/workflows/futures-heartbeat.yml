name: futures-heartbeat

# Keeps the on-chain futures book alive: one mean-reverting trade per tick against
# the deployed ACRFutures venue, so the /curve desk (inventory / OI / mark-to-oracle
# PnL) stays live 24/7 without a local process. Reuses the crash-proof, RPC-429-
# hardened, margin-bounded scripts/futures_loop.py --once.
#
# COST — GitHub bills each run rounded UP to the minute. Hourly ≈ 24 runs/day ×
# ~1–2 min ≈ up to ~1,440 min/month worst-case (less in practice: uv caching +
# GitHub throttles free-tier schedules). To change it, edit the one cron line:
#   "0 * * * *"    hourly        (~≤1,440 min/mo)   ← current
#   "0 */2 * * *"  every 2 hours (~half)
#   "*/30 * * * *" every 30 min  (~double — watch the free 2,000-min tier)
# NOTE: this only trades once an hour, so the *tape* (recent fills) shows a fill
# for its ~17-min window after each tick; the *desk* stays live continuously. Run
# the local loop (scripts/futures_loop.py) for a continuously-scrolling tape.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two heartbeats trade at once (avoids nonce races on the taker).
concurrency:
  group: futures-heartbeat
  cancel-in-progress: false

jobs:
  trade:
    # Base repo only — forks never carry the secret and must not run this.
    if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ACR_ARC_RPC_URL: https://rpc.testnet.arc.network
      ACR_ORACLE_ADDRESS: "0x4f00e3BDd224F4c4b4958D54cD774E84B9092609"
      ACR_FUTURES_ADDRESS: "0x29d97c629a8278f7ec4218ab0bd8baa9182642fe"
      LOOP_BAND: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: One mean-reverting fill
        env:
          TAKER_PRIVATE_KEY: ${{ secrets.ACR_FUTURES_TAKER_KEY }}
        run: uv run python scripts/futures_loop.py --once
