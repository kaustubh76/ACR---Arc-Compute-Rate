name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check packages services scripts redteam

      # The chain-facing tests need a real node, and without one they SKIP —
      # which made them silent. A change to `withdrawable()` broke every test
      # in test_desk_onchain.py and CI stayed green for a day, because a test
      # that skips looks exactly like a test that passes. These suites exist
      # precisely to catch what a mock cannot; running them is the whole point.
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts (the on-chain tests need the artifacts)
        run: cd contracts && forge install --no-git foundry-rs/forge-std || true && forge build
      - name: Start anvil
        run: |
          anvil --silent &
          for _ in $(seq 1 30); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 >/dev/null && exit 0
            sleep 1
          done
          echo "::error::anvil never came up" && exit 1

      - name: Tests
        run: uv run pytest packages services tests -q -p no:cacheprovider --import-mode=importlib

      # Skips are legitimate (a missing optional dep), but the on-chain suites
      # must NOT be among them here — that would put us back to green-by-silence.
      - name: The on-chain tests actually ran
        run: |
          set -o pipefail
          # Pass/fail is pytest's EXIT CODE, not a line of its output. The first
          # version of this step grepped for "N passed" and went red over eight
          # green tests, because -q suppresses that very summary. Parsing a
          # tool's prose for something it already returns is how a checker ends
          # up failing on the truth.
          uv run pytest services/index_api/tests/test_desk_onchain.py \
            services/index_api/tests/test_futures_roll_onchain.py \
            packages/acr_oracle_client/tests/test_onchain.py \
            packages/acr_oracle_client/tests/test_mirror_onchain.py \
            -p no:cacheprovider --import-mode=importlib -rs 2>&1 | tee /tmp/onchain.txt
          # A skip is the failure mode that matters here: these suites skip
          # silently without a node, which is exactly how a broken one stayed
          # green for a day.
          if grep -qE "skipped" /tmp/onchain.txt; then
            echo "::error::an on-chain test SKIPPED — anvil or the contract artifacts are missing"
            exit 1
          fi
      - name: Eval gate (headline claims)
        run: uv run python scripts/eval.py --hours 12 --check

      # The eval gate is one-sided with 1.4-4x headroom, so the measured 124.1 bp
      # could double and still pass it. This is the other half: the estimator's
      # exact output, pinned. A deliberate change re-blesses with `make golden`
      # in the same commit; an accidental one stops here.
      - name: Golden estimator output
        run: uv run python scripts/gen_golden.py --check

      # Offline. Asserts the anchor gap is DECLARED and reproducible, never that
      # it is small — a test red at 1159x is red forever and teaches its reader
      # to ignore it. The size is held by a per-file ratchet instead.
      - name: Anchor gap declared
        run: uv run python scripts/anchors.py --check

      # The docs quote numbers — suite sizes, glossary coverage, deployed
      # addresses — and every one of them was true the day it was typed. Five
      # had silently rotted before anything noticed, in a project whose whole
      # argument is that its claims are true. CLAIMS_FAST skips re-collecting
      # the suites the job has already run above; the cheap checks (glossary,
      # CI shape, addresses, stale-statement guards) still run.
      - name: Claim audit (the docs must still be true)
        env:
          CLAIMS_FAST: "1"
        run: uv run python scripts/verify_claims.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: cd contracts && forge install --no-git foundry-rs/forge-std || true
      - name: Forge test
        run: cd contracts && forge test -vvv

  agent:
    # The buyer agent's hermetic checks: tsc + node:test with a stubbed fetch.
    # No secrets, no chain, no Circle account — the live path is runbook-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/agent
      - name: Type-check
        run: npm run build
        working-directory: apps/agent
      - name: Tests
        run: npm test
        working-directory: apps/agent

  terminal:
    # The Next.js terminal: node:test (buy plan, connection ladder, oracle
    # codec) + a full production build. Hermetic — with no ACR_API the data
    # layer falls back to the bundled snapshot, so the build needs no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/terminal
      - name: Tests
        run: npm test
        working-directory: apps/terminal
      - name: Build
        run: npm run build
        working-directory: apps/terminal

  subgraph:
    # The tape's mappings. `graph build` is itself the schema gate — it rejects
    # a malformed manifest, an aggregation arg naming a field that does not
    # exist, or a non-numeric aggregated field — and matchstick pins the
    # arithmetic the mappings do. Hermetic: no Studio key, no RPC, no chain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: graph
      # graph_abis.py claims a contract change that is not reflected in the
      # mappings fails at codegen. That was only true if someone remembered to
      # regenerate: CI ran codegen against the COMMITTED abis, so drift passed
      # green. Regenerate from the forge artifacts and fail on any diff.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: ABIs match the contracts
        run: |
          # forge-std is gitignored, so a fresh checkout has to fetch it before
          # anything compiles — same step the contracts job runs.
          cd contracts && forge install --no-git foundry-rs/forge-std || true
          forge build && cd ..
          uv sync --all-packages
          uv run python scripts/graph_abis.py
          git diff --exit-code -- graph/abis \
            || { echo "::error::graph/abis is stale — run 'make graph-abis' and commit"; exit 1; }
      - name: Codegen
        run: npx graph codegen
        working-directory: graph
      - name: Build
        run: npx graph build
        working-directory: graph
      - name: Tests
        run: npx graph test
        working-directory: graph

  mcp:
    # The plugin is a thin HTTP client by design, so its tests are about the
    # tool contract: that it forwards an operation NAME and never caller-supplied
    # query text, and that "no suggestion" stays distinguishable from "the tape
    # was unreadable".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: mcp
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: mcp
      - name: Tests
        run: npm test
        working-directory: mcp
