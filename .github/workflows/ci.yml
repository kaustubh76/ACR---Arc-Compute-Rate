name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check packages services scripts redteam

      # The chain-facing tests need a real node, and without one they SKIP —
      # which made them silent. A change to `withdrawable()` broke every test
      # in test_desk_onchain.py and CI stayed green for a day, because a test
      # that skips looks exactly like a test that passes. These suites exist
      # precisely to catch what a mock cannot; running them is the whole point.
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts (the on-chain tests need the artifacts)
        run: cd contracts && forge install --no-git foundry-rs/forge-std || true && forge build
      - name: Start anvil
        run: |
          anvil --silent &
          for _ in $(seq 1 30); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 >/dev/null && exit 0
            sleep 1
          done
          echo "::error::anvil never came up" && exit 1

      - name: Tests
        run: uv run pytest packages services tests -q -p no:cacheprovider --import-mode=importlib

      # Skips are legitimate (a missing optional dep), but the on-chain suites
      # must NOT be among them here — that would put us back to green-by-silence.
      - name: The on-chain tests actually ran
        run: |
          uv run pytest services/index_api/tests/test_desk_onchain.py \
            services/index_api/tests/test_futures_roll_onchain.py \
            packages/acr_oracle_client/tests/test_onchain.py \
            -q -p no:cacheprovider --import-mode=importlib -rs 2>&1 | tee /tmp/onchain.txt
          grep -qE "[0-9]+ passed" /tmp/onchain.txt || { echo "::error::no on-chain tests passed"; exit 1; }
          grep -qE "skipped" /tmp/onchain.txt && { echo "::error::an on-chain test SKIPPED — anvil or artifacts missing"; exit 1; }
          exit 0
      - name: Eval gate (headline claims)
        run: uv run python scripts/eval.py --hours 12 --check

      # The docs quote numbers — suite sizes, glossary coverage, deployed
      # addresses — and every one of them was true the day it was typed. Five
      # had silently rotted before anything noticed, in a project whose whole
      # argument is that its claims are true. CLAIMS_FAST skips re-collecting
      # the suites the job has already run above; the cheap checks (glossary,
      # CI shape, addresses, stale-statement guards) still run.
      - name: Claim audit (the docs must still be true)
        env:
          CLAIMS_FAST: "1"
        run: uv run python scripts/verify_claims.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: cd contracts && forge install --no-git foundry-rs/forge-std || true
      - name: Forge test
        run: cd contracts && forge test -vvv

  agent:
    # The buyer agent's hermetic checks: tsc + node:test with a stubbed fetch.
    # No secrets, no chain, no Circle account — the live path is runbook-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/agent
      - name: Type-check
        run: npm run build
        working-directory: apps/agent
      - name: Tests
        run: npm test
        working-directory: apps/agent

  terminal:
    # The Next.js terminal: node:test (buy plan, connection ladder, oracle
    # codec) + a full production build. Hermetic — with no ACR_API the data
    # layer falls back to the bundled snapshot, so the build needs no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: apps/terminal
      - name: Tests
        run: npm test
        working-directory: apps/terminal
      - name: Build
        run: npm run build
        working-directory: apps/terminal
