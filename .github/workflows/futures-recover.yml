name: futures-recover

# Take one of the project's own keys' collateral back out of the futures venue.
#
# This is a HAND-RUN tool, never a schedule: the venue's automation is supposed
# to keep collateral working, not withdraw it. It exists because collateral is
# per series — a roll leaves a stake stranded on the retired series, where
# nothing trades and nothing reclaims it — and because the keys that run the
# book live only as repository secrets, so no local script can reach them.
#
# Defaults to a DRY RUN. Withdrawing is the kind of action that should be typed
# out on purpose, so `dry_run: false` is a deliberate second step, and the first
# run tells you exactly what the second one will move.

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Which key to withdraw for"
        type: choice
        options: [taker, poster]
        default: taker
      series:
        description: "Only this series id (blank = every series it holds)"
        type: string
        default: ""
      dry_run:
        description: "Report what is free without moving anything"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: futures-recover
  cancel-in-progress: false

jobs:
  recover:
    # Base repo only — forks never carry the secrets and must not run this.
    if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Arc MAINNET (chain 5042). These three are workflow_dispatch only, so
      # nothing fires them on a schedule — but they carried the Arc TESTNET
      # venue, so a manual dispatch would have acted on the chain this project
      # left. No series is listed on the mainnet venue yet, so a run here
      # finds nothing to do until one is seeded; that is the honest state.
      ACR_ARC_RPC_URL: https://rpc.mainnet.arc.io
      ACR_ORACLE_ADDRESS: "0xAfe8a941957EbD3C759fEA5365fe4B75f9626D07"
      ACR_FUTURES_ADDRESS: "0xdb5D7dbB67aD8EC8517982E95c89906abFBC6d3b"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages

      - name: Withdraw free collateral
        env:
          # Selected in the shell rather than the expression, so only the one
          # key that is actually used is ever placed in the environment.
          TAKER_KEY: ${{ secrets.ACR_FUTURES_TAKER_KEY }}
          POSTER_KEY: ${{ secrets.ACR_POSTER_PRIVATE_KEY }}
          WALLET: ${{ inputs.wallet }}
          WITHDRAW_SERIES: ${{ inputs.series }}
          WITHDRAW_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ "$WALLET" = "poster" ]; then
            export WITHDRAW_PRIVATE_KEY="$POSTER_KEY"
          else
            export WITHDRAW_PRIVATE_KEY="$TAKER_KEY"
          fi
          if [ -z "$WITHDRAW_PRIVATE_KEY" ]; then
            echo "::error::no key for '$WALLET' — the repository secret is not set"
            exit 1
          fi
          uv run python scripts/futures_withdraw.py
