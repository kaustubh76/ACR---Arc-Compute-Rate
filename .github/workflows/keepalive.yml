name: keepalive

# The press must not sleep: Render's free tier spins the API down after ~15
# idle minutes, and the hourly oracle poster only runs while the process is
# alive (each wake restarts its timer — see index_api.app._background, which
# also posts immediately when the on-chain record is overdue). A 10-minute
# health ping keeps the single free instance warm ~24/7, which fits inside
# Render's 750 free instance-hours/month.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the press
        run: |
          curl -sS -m 90 -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://acr-api-1fto.onrender.com/health || true
