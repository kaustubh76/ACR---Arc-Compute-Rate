name: keepalive

# The press must not sleep: Render's free tier spins the API down after ~15
# idle minutes, and the hourly oracle poster only runs while the process is
# alive (each wake restarts its timer — see index_api.app._background, which
# also posts immediately when the on-chain record is overdue). A 10-minute
# health ping keeps the single free instance warm ~24/7, which fits inside
# Render's 750 free instance-hours/month.
#
# NOTE on what actually happens: GitHub drops most scheduled ticks on this
# private repo. Measured over 24h, this workflow ran 17 of its 144 slots, with
# gaps up to 3.4h — so treat the cadence as "roughly hourly, sometimes worse",
# never as every ten minutes. Nothing downstream may be sized on the nominal
# rate.
#
# It also PROVES the product, not just the host. A ping that only checks
# /health answers "is something listening", which stayed green through a public
# tape blank 39% of the time, a settled series served as the live desk, and
# `poster_last_tx: null` over a chain full of real posts. The verifier runs here
# rather than in a workflow of its own because Actions minutes are the scarce
# resource that also pays for the heartbeat keeping the book alive.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake the press
        run: |
          curl -sS -m 90 -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://acr-api-1fto.onrender.com/health || true

      # Base repo only — a fork has no Arc RPC budget to spend on this.
      - uses: actions/checkout@v4
        if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
      - uses: astral-sh/setup-uv@v5
        if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync workspace
        if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
        run: uv sync --all-packages

      - name: Prove every pillar is live
        if: github.repository == 'kaustubh76/ACR---Arc-Compute-Rate'
        env:
          ACR_ARC_RPC_URL: https://rpc.testnet.arc.network
          ACR_ORACLE_ADDRESS: "0x4f00e3BDd224F4c4b4958D54cD774E84B9092609"
          ACR_FUTURES_ADDRESS: "0x29d97c629a8278f7ec4218ab0bd8baa9182642fe"
          ACR_REGISTRY_ADDRESS: "0x23ae3E1A306824F0CBA0b6561cB7E5502f63dFb7"
          # The custody wallet's ADDRESS, not Circle credentials. A balance is
          # public, so the runway check needs no secret — and giving CI the
          # entity secret would let a compromised runner move custody funds to
          # buy a warn-only balance read. Not a trade worth making.
          ACR_CUSTODY_ADDRESS: "0x8366968f84a343CF70941EBe858428643d825cb0"
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/verify_live.py
