# The live seller's configuration, in version control.
#
# Production runs on Render as the `acr-api` web service
# (https://acr-api-1fto.onrender.com). Until this file existed the deploy was
# unreproducible: `deploy/deploy-render.sh` is create-only and sets none of the
# desk-critical variables, so `ACR_FUTURES_ADDRESS` and all four `ACR_CIRCLE_*`
# values lived only in the dashboard. Deleting the service would have lost them.
#
# Secrets carry `sync: false` — the NAME is tracked here, the VALUE stays in the
# dashboard and is never committed. Non-secret values are inlined because they
# are the deploy's actual identity (which contracts, which chain, which tape)
# and belong under review.
#
# Render is NOT wired to this repo: the service pulls a prebuilt image from
# Docker Hub, so a code change reaches production only via
# `deploy/redeploy-render.sh` (build → push → redeploy). Blueprint sync is
# therefore optional — the value here is that the configuration is recorded.

services:
  - type: web
    name: acr-api
    runtime: image
    plan: free # NB: no persistent disk. See the faucet ledger note below.
    region: oregon
    image:
      url: docker.io/kaushtubh02/acr-api:latest
    healthCheckPath: /health
    envVars:
      # --- Arc + the deployed contracts -----------------------------------
      - key: ACR_ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ACR_ORACLE_ADDRESS
        value: "0x4f00e3BDd224F4c4b4958D54cD774E84B9092609"
      - key: ACR_REGISTRY_ADDRESS
        value: "0x23ae3E1A306824F0CBA0b6561cB7E5502f63dFb7"
      # The futures venue. Without this the Public Desk 503s on every action.
      - key: ACR_FUTURES_ADDRESS
        value: "0x29d97c629a8278f7ec4218ab0bd8baa9182642fe"
      - key: ACR_ATTESTOR_ADDRESS
        value: "0xe671a8E73900F1186448cFFeA9e730F5E50DFD47"

      # --- the tape ----------------------------------------------------------
      # Filled at deploy. Tracked here for the same reason the file exists at
      # all: values that live only in the dashboard are lost with the service.
      #
      # ACR_ORACLE_ADDRESS above stays on v1 — ACRFutures settles against it and
      # its oracle pointer is immutable. v2 is ADDITIONAL, never a replacement.
      - key: ACR_ORACLE_V2_ADDRESS
        value: "0xFCa038CEad7b9e9aa8fDAfc9e80253835fB8FFEA"
      - key: ACR_RECEIPT_MIRROR_ADDRESS
        value: "0xA9CD5b9503aeA88EB343333E842D2860b263DB65"
      # Empty → the mirror chore stands down and /tca reports itself unavailable,
      # rather than the service coming back from a deploy silently blind to the
      # whole tape.
      - key: ACR_SUBGRAPH_URL
        value: ""
      - key: ACR_KEEPER_MIRROR_S
        value: "120"
      # Server-side only — a Studio key in a browser is a key anyone can spend.
      - key: ACR_GRAPH_API_KEY
        sync: false

      # --- Circle: the custody wallet that signs prints and funds the desk --
      - key: ACR_CIRCLE_API_KEY
        sync: false
      - key: ACR_CIRCLE_ENTITY_SECRET
        sync: false
      - key: ACR_CIRCLE_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: ACR_CIRCLE_WALLET_ID
        value: 52251d34-9575-5bab-8631-52afae6ac3cd
      - key: ACR_CIRCLE_WALLET_SET_ID
        value: 69c39de5-9d31-5ef0-bccb-731028f68c6b
      # The venue's own custody wallets, so one credential stops being four jobs.
      # Kept apart from the poster above AND from each other: ACRFutures.trade
      # refuses a maker taking its own quote, so the book's counterparty and the
      # heartbeat cannot share a wallet. Ids are not secrets — the API key and
      # entity secret are what authorize them, and those stay `sync: false`.
      # See docs/WALLETS.md for why each role gets the wallet type it does.
      - key: ACR_CIRCLE_MAKER_WALLET_ID
        value: 33b9249c-1f97-5d76-b550-39ff8825e546
      - key: ACR_CIRCLE_TAKER_WALLET_ID
        value: f1238074-2ba2-50c8-ab3d-b6f9c630d775
      - key: ACR_CIRCLE_BASE_URL
        value: https://api.circle.com

      # --- x402: the real Circle Gateway gate ------------------------------
      - key: ACR_X402_MODE
        value: circle
      - key: ACR_X402_FACILITATOR_URL
        value: https://gateway-api-testnet.circle.com
      # Revenue lands in the Circle treasury wallet, not the retiring EOA it used
      # to. Worth being precise about why this one is safe to co-locate: payTo is
      # a RECEIVING address and needs no key at all, so it carries none of the
      # authority that made one credential doing four jobs a problem. Revenue
      # arriving where the press and faucet already draw from is a coherent
      # flow rather than role confusion. See docs/WALLETS.md.
      - key: ACR_X402_PAY_TO
        value: "0x8366968f84a343CF70941EBe858428643d825cb0"

      # --- The published tape is the SIMULATOR, deliberately ---------------
      # Real Arc USDC transfers carry no compute-price signal — measured, not
      # assumed: `scripts/tape_audit.py` reads ~11.9k real settlements that
      # collapse to a single price. Every paid response labels this.
      - key: ACR_TAPE_SOURCE
        value: sim
      # Sized for the 512MB free tier — larger values OOM-kill the instance.
      - key: ACR_SIM_EVENTS_PER_SERVICE
        value: "2500"
      - key: ACR_SIM_HORIZON_SECONDS
        value: "14400"
      - key: ACR_ATTACK_SIM_EVENTS_PER_SERVICE
        value: "800"
      # Hourly, not every 30s: each refresh posts on-chain and costs real gas.
      - key: ACR_REFRESH_SECONDS
        value: "3600"

      # --- The autonomous hedger's two PUBLIC identities --------------------
      # Both are addresses, not credentials: /hedger derives the agent's whole
      # state from public chain data and the receipt tape, and holds no key for
      # it. Inlined rather than `sync: false` for that reason — they are the
      # deploy's identity (which agent this surface reports on), and they are
      # already printed in docs/SUBMISSION.md. Until now they lived only in the
      # dashboard, so a rebuilt service would have served `configured: false`
      # and quietly dropped the agent from the product. Unset either and the
      # surface says so rather than inventing an empty agent; the same two must
      # be exported for `make snapshot` or the archived edition loses it too.
      # Two addresses, one agent — docs/WALLETS.md explains why it needs both.
      - key: ACR_HEDGER_ADDRESS
        value: "0x1Dc707E330d7B1Cd9b2d0a0C0346CE2D19d35bc9"
      - key: ACR_HEDGER_PAYER
        value: "0x71E140D9540d3163EAD1591f81b454C6d5BD26C0"
      # The mandate the panel shows, recorded rather than left to a code
      # default. Both hedger modules default to the same number and a test pins
      # them together, so this is belt-and-braces — but the mandate is a
      # deliberate operating choice, and a choice that lives only in a default
      # is one nobody can see they made.
      - key: HEDGER_TARGET
        value: "2.5"

      # The instance's own URL, knocked on every ACR_CHAIN_WARM_SECONDS so it
      # never looks idle. The press only posts while this process is AWAKE, and
      # the free plan sleeps after ~15 idle minutes — measured gaps between
      # on-chain prints ran 80 · 64 · 122 · 62 · 100 · 216 · 82 · 82 minutes
      # against a contract that will not settle on a print older than 120. The
      # posting logic was never wrong; nothing was waking it. The external cron
      # in .github/workflows/keepalive.yml drops ~88% of its ticks, so it cannot
      # be the thing this depends on.
      - key: ACR_SELF_URL
        value: https://acr-api-1fto.onrender.com

      # --- The agent gate + the screen (docs/AGENT-MODULE.md) ---------------
      # Recorded for the reason this file exists: until 2026-09-13 every one of
      # these lived only in the dashboard, beside a doc that called the module
      # "live in production". None is a secret EXCEPT the credentials, which are
      # a Render secret FILE — the variable holds its PATH. `/armor/info` serves
      # project, location and template publicly, so inlining them reveals nothing.
      - key: ACR_AGENT_AUDIENCE
        value: acr-index-api
      - key: ACR_ARMOR_MODE
        value: auto
      - key: ACR_ARMOR_PROJECT_ID
        value: gen-lang-client-0589290672
      - key: ACR_ARMOR_LOCATION
        value: asia-south1
      - key: ACR_ARMOR_TEMPLATE
        value: EthOnline_Project
      - key: ACR_ARMOR_CREDENTIALS_FILE
        value: /etc/secrets/acr_armor_sa.json
      # The human tier's chain-side source of truth. Without it the gate still
      # runs, refuses every human claim, and says so on /ops and in the footer.
      - key: ACR_HUMANID_MIRROR_ADDRESS
        value: "0x7f41faA38F35F1FABfc76Df5B1618fC8d0c0d8e5"

      # --- Paths + CORS ----------------------------------------------------
      # NOTE: the free plan has NO persistent disk, so these files (and the
      # faucet ledger beside them) are empty on every boot. That is why the
      # ledger also rehydrates from Circle's own record of the transfers —
      # see FaucetLedger in services/index_api/index_api/desk.py.
      - key: ACR_RECEIPT_LOG_PATH
        value: data/x402_receipts.jsonl
      # The durable record of REAL Gateway settlements. Lives under services/
      # rather than data/ ON PURPOSE: data/ is in BOTH .gitignore and
      # .dockerignore ("secret-bearing … even by accident"), so a file there
      # is neither committed nor copied into the image — it would never reach
      # production at all. This path IS copied, by `COPY services/ services/`.
      # Without it the live product reported `paid_queries: 0` over a gate that
      # had genuinely been paid. Opt-in by design: defaulting it on would put
      # real revenue into every developer's local counters.
      - key: ACR_RECEIPT_ARCHIVE_PATH
        value: services/index_api/index_api/receipts_live.jsonl
      - key: ACR_WEBHOOK_LOG_PATH
        value: data/webhook_events.jsonl
      # Open by design (agents call this from anywhere). The desk endpoints are
      # therefore directly reachable, which is why their guardrails are
      # server-side: session-bound faucet, rate limits, qty clamps.
      - key: ACR_CORS_ORIGINS
        value: "*"
