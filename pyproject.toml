[project]
name = "acr"
version = "0.1.0"
description = "ACR — The Arc Compute Rate: a manipulation-resistant benchmark family for machine commerce"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "acr-core",
    "acr-sim",
    "acr-tape",
    "acr-estimator",
    "acr-instrument",
    "acr-oracle-client",
    "acr-index-api",
]

[tool.uv.sources]
acr-core = { workspace = true }
acr-sim = { workspace = true }
acr-tape = { workspace = true }
acr-estimator = { workspace = true }
acr-instrument = { workspace = true }
acr-oracle-client = { workspace = true }
acr-index-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() defaults are the idiomatic pattern.
# UP042: (str, Enum) is intentional for pydantic-friendly string enums.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
python_files = ["test_*.py"]
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
